name: Deal alert jeux video

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min
  workflow_dispatch:          # lancement manuel possible

permissions:
  contents: write

concurrency:
  group: deal-alert
  cancel-in-progress: false

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python deal_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Sauvegarde des deals (site + historique)
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add seen.json docs/deals.json
          git diff --staged --quiet && exit 0
          git commit -m "maj deals"
          git pull --rebase
          git push
